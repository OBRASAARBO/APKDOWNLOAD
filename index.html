<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download APK</title>
  <style>
    :root {
      --bg: #eef2ee;
      --card: #ffffff;
      --ink: #14211a;
      --muted: #5b6b61;
      --line: #cdd8d0;
      --accent: #1f7a4d;
      --accent-dark: #17613c;
      --ok-bg: #e3f4ea;
      --ok-ink: #14573a;
      --err-bg: #fbe8e6;
      --err-ink: #8c2a20;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 8px 30px rgba(20, 33, 26, 0.08);
    }
    .icon {
      width: 52px; height: 52px;
      border-radius: 14px;
      background: var(--accent);
      display: grid; place-items: center;
      margin-bottom: 18px;
    }
    .icon svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.5rem; margin: 0 0 6px; letter-spacing: -0.01em; }
    p.sub { margin: 0 0 22px; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
    label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 8px; }
    input[type="text"] {
      width: 100%;
      font-size: 1.25rem;
      letter-spacing: 0.12em;
      text-align: center;
      padding: 14px 12px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fafcfa;
      color: var(--ink);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]:disabled { opacity: 0.6; }
    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      transition: background 0.15s;
    }
    button:hover:not(:disabled) { background: var(--accent-dark); }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #8fd1ad; outline-offset: 2px; }
    button:disabled { opacity: 0.75; cursor: not-allowed; }
    .spinner {
      width: 18px; height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }
    button.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
    .msg {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.93rem;
      line-height: 1.45;
    }
    .msg.show { display: block; }
    .msg.ok { background: var(--ok-bg); color: var(--ok-ink); }
    .msg.err { background: var(--err-bg); color: var(--err-ink); }
    .msg a { color: inherit; font-weight: 600; }
    .hint { margin: 18px 0 0; font-size: 0.8rem; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
    </div>
    <h1>Download the app</h1>
    <p class="sub">Enter your one-time PIN to get the APK. Each PIN works once.</p>

    <form id="pinForm" autocomplete="off" novalidate>
      <label for="pin">Your PIN</label>
      <input type="text" id="pin" name="pin" maxlength="64" placeholder="Enter PIN"
             autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit" id="btn">
        <span class="spinner" aria-hidden="true"></span>
        <span id="btnText">Download APK</span>
      </button>
    </form>

    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <p class="hint">After downloading, open the file on your Android device to install it.</p>
  </main>

  <script>
    // PASTE your Apps Script Web App URL here (the one ending in /exec)
    const API_URL = 'https://script.google.com/macros/s/AKfycbyzMzkMKxKRojYhEYS_3fjsuKRogLuyONJiVHXKIZlkS3XmmUglrNuVIDX7iUz-5Tww/exec';

    const form = document.getElementById('pinForm');
    const pinInput = document.getElementById('pin');
    const btn = document.getElementById('btn');
    const btnText = document.getElementById('btnText');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const pin = pinInput.value.trim();
      if (!pin) {
        showMessage('Please enter your PIN.', false);
        pinInput.focus();
        return;
      }
      setLoading(true);
      hideMessage();

      // No custom headers on purpose: keeps this a "simple" request so the browser skips CORS preflight.
      fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ pin: pin }),
        redirect: 'follow'
      })
        .then(function (r) { return r.text(); })
        .then(function (text) {
          var data;
          try { data = JSON.parse(text); }
          catch (e) {
            console.error('Server did not return JSON. First 300 chars:', text.slice(0, 300));
            setLoading(false);
            showMessage('The server sent an unexpected reply. Open the browser console (F12) for details.', false);
            return;
          }
          onResult(data);
        })
        .catch(function (err) {
          console.error('Request failed:', err);
          onError(err);
        });
    });

    function onResult(res) {
      setLoading(false);
      if (!res || !res.success) {
        showMessage((res && res.message) || 'Something went wrong. Please try again.', false);
        return;
      }
      pinInput.value = '';
      try {
        const url = triggerDownload(res.dataUri, res.fileName);
        showMessage(res.message + ' If nothing happens, <a href="' + url + '" download="' + escapeAttr(res.fileName) + '">tap here to save the file</a>.', true, true);
      } catch (err) {
        showMessage('Your PIN was accepted, but the download could not start on this browser. Please contact the administrator.', false);
      }
    }

    function onError(err) {
      setLoading(false);
      showMessage('Could not reach the server. Check your connection and try again.', false);
    }

    // Converts the data URI to a Blob and clicks a temporary download link.
    function triggerDownload(dataUri, fileName) {
      const parts = dataUri.split(',');
      const mime = parts[0].match(/:(.*?);/)[1];
      const bin = atob(parts[1]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blobUrl = URL.createObjectURL(new Blob([bytes], { type: mime }));

      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = fileName || 'app.apk';
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      return blobUrl;
    }

    function setLoading(on) {
      btn.disabled = on;
      pinInput.disabled = on;
      btn.classList.toggle('loading', on);
      btnText.textContent = on ? 'Checking PIN…' : 'Download APK';
    }

    function showMessage(text, ok, isHtml) {
      msg.className = 'msg show ' + (ok ? 'ok' : 'err');
      if (isHtml) msg.innerHTML = text; else msg.textContent = text;
    }

    function hideMessage() { msg.className = 'msg'; msg.textContent = ''; }

    function escapeAttr(s) { return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  </script>
</body>
</html>
